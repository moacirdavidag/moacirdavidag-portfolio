[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # NEXT_PUBLIC_* vars are intentionally public (embedded in client bundle by Next.js)
  # SMTP_USER = public contact email displayed on the site
  # SMTP_HOST = public mail server hostname
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_GA_ID,SMTP_USER,SMTP_HOST"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
