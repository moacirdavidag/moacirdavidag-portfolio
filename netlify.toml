[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # O e-mail e o host SMTP aparecem no site como contato público — não são segredos reais
  SECRETS_SCAN_OMIT_KEYS = "SMTP_USER,SMTP_HOST"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
